language: python

python:
- '3.9'
- '3.10'
- '3.11'
- '3.12'

install:
- curl -LsSf https://astral.sh/uv/install.sh | sh
- uv sync
- uv run python -c "import populationsim"

script:
- uv run ruff check populationsim
- uv run pytest --cov populationsim --cov-report term-missing
# Build docs
- uv pip install sphinx numpydoc sphinx_rtd_theme==0.5.2
- cd docs
- make clean
- make html
- touch _build/html/.nojekyll

deploy:
  provider: pages
  local_dir: docs/_build/html
  skip_cleanup: true
  github_token: $GH_TOKEN_POPSIM  # Set in the settings page of the repository, as a secure variable
  keep_history: true
  on:
    branch: master
