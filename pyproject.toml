[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "populationsim"
version = "0.10.0"
description = "Population Synthesis (for ActivitySim)"
authors = [
    { name = "Ben Stabler", email = "ben.stabler@rsginc.com" }
    ]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy>=2.0.0,<3",
    "ortools>=9.14.0",
    "pyinstrument>=5.0.1",
    "pyyaml>=6.0.2",
    "psutil>=7.0.0",
    "pandas>=2.2",
    "tables>=3.9",
    "orca>=1.8",
    "blosc2>=2.5.1",
    "cvxpy[glpk]>=1.6.5",
    "numba>=0.60.0",
    "pyarrow>=20.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.9",
]
docs = [
    "sphinx>=8,<9",
    "numpydoc>=1.8,<2",
    "sphinx-rtd-theme>=3,<4",
]

[tool.uv]
# eMudhra incident, see https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
# Added virtualenv 21.14.12 because it embeds pip 26.2.2, which pre-commit uses to install hooks.
required-version = ">=0.13.4"
constraint-dependencies = ["certifi>=2026.10.19", "virtualenv>=21.14.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["populationsim*"]

[project.scripts]
populationsim = "populationsim.__main__:main"
