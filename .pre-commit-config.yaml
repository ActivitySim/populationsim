repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: black
        name: Black (uv.lock)
        entry: uv run --locked black
        language: system
        types_or: [python, pyi]
      - id: ruff
        name: Ruff (uv.lock)
        entry: uv run --locked ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
